# Inherited by the projects tagged `ts` (all of them). moon has no `^default`: without the
# javascript toolchain it does not hash the files of a project this one depends on. The apps and the
# CLI import the engine, so each task hashes every package, and a change to the engine re-runs them
# all. Cache correctness over granularity.
$schema: "../cache/schemas/tasks.json"

inheritedBy:
  tags: ["ts"]

implicitInputs:
  - "/packages/**/*"
  # Vitest's and Playwright's globalSetup, which every test run loads.
  - "/scripts/test-tmp-scope.ts"
  # node_modules is gitignored, but a workspace package's node_modules holds symlinks that the glob
  # still walks, and moon warns on each one it cannot hash as a file. dist, .wrangler and the
  # Playwright output are what a build or a test run leaves behind.
  - "!/**/node_modules/**"
  - "!/**/dist/**"
  - "!/**/.wrangler/**"
  - "!/**/.tanstack/**"
  - "!/**/test-results/**"
  - "!/**/playwright-report/**"
  # routeTree.gen.ts is left in: `tsr generate` rewrites it to the same bytes, so the hash holds, and
  # a test that reads it must re-run when it changes.

tasks:
  # Every project but `scripts` runs its Vitest suite from its own root.
  test:
    command: "bun --bun vitest run"
