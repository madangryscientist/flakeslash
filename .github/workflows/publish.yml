name: Publish

# Publishes @hackcove/flakeslash (packages/cli) to npm. Manual only: the maintainer decides when a
# release goes out, and the default is a dry run. The version is the one in packages/cli/package.json;
# npm runs the package's `prepack`, which copies LICENSE and NOTICE in and rebuilds dist.
#
# The first publish needs an NPM_TOKEN secret on the `npm-publish` environment: npm cannot attach a
# trusted publisher to a package that does not exist yet. Every later publish uses the trusted
# publisher on npmjs.com (OIDC, no token), once the token is deleted. See docs/releasing.md.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (packs and checks, publishes nothing)
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # the OIDC token for trusted publishing and for --provenance
    env:
      # moon diffs against the base branch before it runs anything (see ci.yml), so it needs the
      # remote ref and the full history.
      MOON_BASE: origin/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      # With NPM_TOKEN set, setup-node writes an .npmrc that reads NODE_AUTH_TOKEN. Without it there
      # is no .npmrc and npm authenticates through OIDC.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: ${{ secrets.NPM_TOKEN != '' && 'https://registry.npmjs.org' || '' }}
      - name: Use a trusted-publishing capable npm
        run: npm install -g npm@^11.5.1 && npm --version
      - run: bun install --frozen-lockfile
      - name: Gate
        env:
          MOON_REMOTE_TOKEN: ${{ secrets.MOON_CACHE_READ_TOKEN }}
        run: bun run typecheck && bun run test
      - name: Publish
        working-directory: packages/cli
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --dry-run
          else
            npm publish --provenance --access public
          fi
