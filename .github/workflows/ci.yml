name: CI

# The gate from AGENTS.md, on a GitHub-hosted runner. The trigger is `pull_request` (never
# `pull_request_target`), so a pull request from a fork runs with a read-only token and no secrets.
# Actions are pinned to a commit; the tag is in the comment.
#
# The only secrets are the moon remote cache tokens, passed as MOON_REMOTE_TOKEN to the steps that
# run moon. A pull request reads with MOON_CACHE_READ_TOKEN (a repository secret) and its uploads are
# refused with a warning. A push to main writes with MOON_CACHE_WRITE_TOKEN, which lives only in the
# `moon-cache-write` environment that only main may deploy from. A fork sends no token; moon warns
# about the 401 and runs on its local cache.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Bun the repo is built and pinned against (.tool-versions).
  BUN_VERSION: "1.4.2"

jobs:
  gate:
    name: Gate (typecheck, lint, format, test)
    environment: ${{ github.event_name == 'push' && 'moon-cache-write' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # moon 2.6.5 diffs the head against the base branch before any task runs, even for a plain
      # `moon run`, and the checkout has no local `main`, so it names the remote ref. That needs the
      # full history (fetch-depth: 0 below).
      MOON_BASE: origin/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun scripts/check-workflows.ts .github/workflows/*.yml
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
        env:
          MOON_REMOTE_TOKEN: ${{ github.event_name == 'push' && secrets.MOON_CACHE_WRITE_TOKEN || secrets.MOON_CACHE_READ_TOKEN }}
      - run: bun run lint
        env:
          MOON_REMOTE_TOKEN: ${{ github.event_name == 'push' && secrets.MOON_CACHE_WRITE_TOKEN || secrets.MOON_CACHE_READ_TOKEN }}
      - run: bun run format:check
      - run: bun run test
        env:
          MOON_REMOTE_TOKEN: ${{ github.event_name == 'push' && secrets.MOON_CACHE_WRITE_TOKEN || secrets.MOON_CACHE_READ_TOKEN }}

  changes:
    name: Did an app change?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.diff.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "apps=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The apps and packages (what they import), plus what decides how they install and run.
          if git diff --name-only "origin/$BASE_REF...HEAD" \
            | grep -qE '^(apps/|packages/|\.moon/|package\.json$|bun\.lock$|bunfig\.toml$|\.node-version$|\.github/workflows/ci\.yml$)'; then
            echo "apps=true" >> "$GITHUB_OUTPUT"
          else
            echo "apps=false" >> "$GITHUB_OUTPUT"
          fi

  apps:
    name: Apps gate (build, e2e, deploy dry run)
    environment: ${{ github.event_name == 'push' && 'moon-cache-write' || '' }}
    needs: changes
    if: needs.changes.outputs.apps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # moon 2.6.5 diffs the head against the base branch before any task runs, even for a plain
      # `moon run`, and the checkout has no local `main`, so it names the remote ref. That needs the
      # full history (fetch-depth: 0 below).
      MOON_BASE: origin/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - name: Install the Playwright browser
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium-headless-shell
      - run: bunx moon run web:test-e2e
        env:
          MOON_REMOTE_TOKEN: ${{ github.event_name == 'push' && secrets.MOON_CACHE_WRITE_TOKEN || secrets.MOON_CACHE_READ_TOKEN }}
      # --force: web:test-e2e left a dist built with the e2e env, and a cache hit here would not
      # rebuild it, so the dry run below would check the e2e bundle. --force skips the cache read and
      # still uploads on main.
      - run: bunx moon run web:build --force
        env:
          MOON_REMOTE_TOKEN: ${{ github.event_name == 'push' && secrets.MOON_CACHE_WRITE_TOKEN || secrets.MOON_CACHE_READ_TOKEN }}
      - name: Web deploy dry run
        working-directory: apps/web
        run: bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/fl-web-dry"
      - run: bunx moon run site:build
        env:
          MOON_REMOTE_TOKEN: ${{ github.event_name == 'push' && secrets.MOON_CACHE_WRITE_TOKEN || secrets.MOON_CACHE_READ_TOKEN }}
      - run: bunx moon run site:test-e2e
        env:
          MOON_REMOTE_TOKEN: ${{ github.event_name == 'push' && secrets.MOON_CACHE_WRITE_TOKEN || secrets.MOON_CACHE_READ_TOKEN }}
      - name: Site deploy dry run
        working-directory: apps/site
        run: bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/fl-site-dry"
